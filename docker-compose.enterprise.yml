# docker-compose.enterprise.yml — sovereign per-tenant Enterprise stack.
# Created: 2026-06-10 (sov/w1a-deploy).
#
# WHY (vs the root docker-compose.yml): the root compose is OSS single-user;
# its mongo is a dev-only `--profile mongo` add-on that the app reaches at
# mongodb://localhost:27017 — which BREAKS container-to-container (localhost
# inside the app container is the app, not Mongo). This compose wires the full
# enterprise tenant on one box: the EE app + MongoDB + Redis, all on a private
# bridge network, addressed by SERVICE NAME (mongo, redis), not localhost. The
# web client is served by the app process itself (FastAPI StaticFiles + the EE
# route provider mount the paw-enterprise admin UI), so there is no separate
# frontend container — `app` is the whole web surface.
#
# What this fixes from the public docs (OSS single-user, wrong port):
#   * container-to-container URIs: CLOUD_MONGODB_URI + POCKETPAW_MONGO_URI use
#     `mongo`, POCKETPAW_REDIS_URL uses `redis` (service names).
#   * the kb binary is baked into the image (Dockerfile.enterprise) and pointed
#     at via POCKETPAW_KB_BIN — the runtime no longer needs `kb` on the host.
#   * the port is 8888 (POCKETPAW_WEB_PORT), not the stale 8000.
#
# Secrets: AUTH_SECRET is auto-generated + persisted on first run by the image
# entrypoint (see docker-entrypoint.enterprise.sh); the initial admin password
# is generated by the app and printed ONCE to the logs (`docker compose logs
# app`). Set POCKETPAW_LICENSE_PUBLIC_KEY (and the rest) in a sibling .env —
# copy .env.enterprise.example to .env first. See docs/deployment/sovereign-tenant.mdx.
#
# Quick start:
#   cp .env.enterprise.example .env      # then edit: API key, license public key
#   docker compose -f docker-compose.enterprise.yml up -d --build
#   docker compose -f docker-compose.enterprise.yml logs app | grep -i password

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    image: pocketpaw-ee
    container_name: pocketpaw-ee-app
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${POCKETPAW_PORT:-8888}:8888"
    environment:
      # ── Container-to-container service URIs (the core fix) ──────────────
      # Mongo: the EE cloud layer reads CLOUD_MONGODB_URI; the agent CLIs read
      # POCKETPAW_MONGO_URI. Both point at the `mongo` service, NOT localhost.
      CLOUD_MONGODB_URI: "mongodb://mongo:27017/paw-enterprise"
      POCKETPAW_MONGO_URI: "mongodb://mongo:27017/paw-enterprise"
      # Redis: resumable chat runs + the Tier 2 arq worker. Service name, not
      # localhost. Without this the app degrades to in-memory (loud WARN).
      POCKETPAW_REDIS_URL: "redis://redis:6379/0"
      # Production posture is baked into the image (POCKETPAW_ENV=production).
      # AUTH_SECRET is bootstrapped by the entrypoint; do NOT hardcode it here.
    env_file:
      # Operator config: ANTHROPIC API key, POCKETPAW_LICENSE_PUBLIC_KEY,
      # POCKETPAW_LICENSE_KEY, optional AUTH_SECRET / ADMIN_PASSWORD overrides.
      # Copy .env.enterprise.example → .env and fill it in.
      - path: .env
        required: false
    volumes:
      # App state (config, the persisted auth_secret, access token). The
      # entrypoint writes the generated AUTH_SECRET here so it survives restarts.
      - pocketpaw-data:/home/pocketpaw/.pocketpaw
      # Agent-created files — accessible at ./workspace/ on the host.
      - ./workspace:/home/pocketpaw/workspace
    extra_hosts:
      # Reach host services (e.g. a host Ollama) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
        reservations:
          memory: 2G
          cpus: "2"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: pocketpaw-ee-mongo
    # No host port published by default — Mongo is reachable only on the private
    # `internal` network by the app. Uncomment to expose for debugging:
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # depends_on: service_healthy gates the app on a real Mongo readiness ping.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pocketpaw-ee-redis
    # Append-only persistence so queued runs survive a redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    # No host port published by default — internal only. Uncomment to debug:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pocketpaw-data:
  mongo-data:
  redis-data:
