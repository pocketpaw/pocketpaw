# Gmail connector — REST API over OAuth bearer token.
# Created: 2026-05-03 — Phase 1 PR-3.
# Updated: 2026-06-07 (M3 connector→skill auto-authoring) — added the optional
#   ``surface_profile:`` block. When this connector is bound to a pocket
#   (scope=pocket), the cloud derivation helper folds this block into the
#   pocket's PocketSurfaceProfile so the entity room auto-loads the bundled
#   ``gmail`` skill (no hand-setting). See ``allow_tools`` note below re: the
#   tool-id pattern.
# This YAML carries the catalog metadata + the action manifest. The
# runtime wiring lives in src/pocketpaw/connectors/adapters/gmail.py
# (GmailConnector) which wraps the existing GmailClient from
# src/pocketpaw/clients/gmail.py. The 8 hand-written tool classes
# in src/pocketpaw/tools/builtin/gmail.py stay in place for Phase 1 —
# their LLM-tuned response formatting is preserved verbatim.
#
# A future PR (3.5 or later) replaces those tool classes with
# generated ones via tools.builtin.connector_tools.connector_tools_for(c).
# Snapshot tests in tests/connectors/test_gmail_connector.py pin the
# action names + descriptions so the replacement is byte-identical.

name: gmail
display_name: Gmail
type: communication
icon: mail

# M3 — connector→skill/tool auto-authoring. When Gmail is bound to a pocket,
# the entity room auto-loads the bundled "gmail" skill (which teaches the
# search→read→act workflow over the actions below).
#
# allow_tools NOTE on the tool-id pattern: gmail's agent tools are the
# hand-written BaseTool classes in src/pocketpaw/tools/builtin/gmail.py
# (gmail_search / gmail_read / gmail_send / ...). They are NOT yet wrapped as
# ``mcp__<server>__<tool>`` SDK tool ids — a future connector-tools PR
# generates those. So today the SKILL is the load-bearing contribution and
# allow_tools is left EMPTY: the resolver treats an empty allow as "no SDK-tool
# restriction" (the union only ADDS to the allowlist, never narrows it), so an
# empty list is the safe, correct default until the gmail tools have stable MCP
# ids to glob against. When they do, set e.g. allow_tools: ["mcp__*gmail*"].
surface_profile:
  skill: gmail
  allow_tools: []
  deny_tools: []

auth:
  method: oauth2
  credentials:
    - name: GOOGLE_OAUTH_TOKEN
      description: OAuth access token with https://mail.google.com/ scope
      required: true

actions:
  - name: gmail_search
    description: Search Gmail for emails matching a query (Gmail search syntax).
    method: GET
    trust_level: auto
    execution_mode: cloud
  - name: gmail_read
    description: Read the full body of a single Gmail message by ID.
    method: GET
    trust_level: auto
    execution_mode: cloud
  - name: gmail_send
    description: Send an email from the authenticated account.
    method: POST
    trust_level: confirm
    execution_mode: cloud
  - name: gmail_list_labels
    description: List all labels in the mailbox.
    method: GET
    trust_level: auto
    execution_mode: cloud
  - name: gmail_create_label
    description: Create a new label.
    method: POST
    trust_level: confirm
    execution_mode: cloud
  - name: gmail_modify
    description: Add or remove labels on a message.
    method: POST
    trust_level: confirm
    execution_mode: cloud
  - name: gmail_trash
    description: Move a message to Trash.
    method: POST
    trust_level: confirm
    execution_mode: cloud
  - name: gmail_batch_modify
    description: Apply label changes to many messages at once.
    method: POST
    trust_level: confirm
    execution_mode: cloud
  - name: gmail_summary
    description: Aggregate inbox stats (unread, today, avg reply time) for the Email Stats widget.
    method: GET
    trust_level: auto
    execution_mode: cloud
