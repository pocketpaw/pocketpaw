[project.scripts]
pocketpaw = "pocketpaw.__main__:main"
paw = "pocketpaw.paw.cli:main"

# --- Extension-point providers (OSS-EE split) ---
# Core (`pocketpaw`) discovers optional providers via importlib entry-points
# in the `pocketpaw.*` groups — see pocketpaw/extensions.py for the Protocols
# and pocketpaw/_registry.py for discovery. The enterprise providers are
# declared by the `pocketpaw-ee` package (ee/pyproject.toml), not here: the
# OSS core ships no entry-points of its own and degrades gracefully when none
# are found.

[project.urls]
Homepage = "https://pocketpaw.xyz"
Repository = "https://github.com/pocketpaw/pocketpaw"
Issues = "https://github.com/pocketpaw/pocketpaw/issues"
Documentation = "https://pocketpaw.xyz/introduction"
Discord = "https://discord.gg/asRrtm95Zc"
Twitter = "https://twitter.com/prakashd88"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# OSS core only. The enterprise layer (ee/pocketpaw_ee) is built as the
# separate `pocketpaw-ee` wheel from ee/pyproject.toml.
only-include = ["src/pocketpaw"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py311"
# Skip vendored third-party code. The OASIS fork at
# ee/pocketpaw_ee/foresight/substrate/oasis/ is upstream code under
# Apache-2.0; we treat it as a frozen snapshot and don't reformat it
# (see substrate/oasis/README-FORK.md for the drift policy). Any
# behavioural edits we make in future PRs carry a per-file
# "Modified by PocketPaw" notice and can be linted then.
extend-exclude = [
    "ee/pocketpaw_ee/foresight/substrate/oasis",
]

[tool.mypy]
# Same rationale as the ruff extend-exclude above. The vendored OASIS
# fork at substrate/oasis/ carries upstream type-checking debt we
# inherited (implicit Optionals, unannotated variables, narrow
# subclass-vs-base mismatches). We don't fix upstream — see the drift
# policy in substrate/oasis/README-FORK.md.
exclude = [
    "ee/pocketpaw_ee/foresight/substrate/oasis/.*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt-text modules — long lines inside multi-line example/docs
# strings can't be wrapped without changing the rendered prompt.
"src/pocketpaw/ripple/_pockets.py" = ["E501"]
"src/pocketpaw/ripple/_design.py" = ["E501"]
"ee/pocketpaw_ee/cloud/decisions/explain/extractor.py" = ["E501"]
"ee/pocketpaw_ee/cloud/decisions/explain/narrator.py" = ["E501"]
# Studio style registry + softening prompts: each style carries rich
# promptSuffix/config strings appended to the model prompt verbatim, so their
# long single-line strings can't be wrapped without changing the rendered prompt.
"ee/pocketpaw_ee/cloud/studio/style_catalog.py" = ["E501"]
"ee/pocketpaw_ee/cloud/studio/prompt_soften.py" = ["E501"]
# Embedded fake-herdr shim: canned JSON envelopes are single-line by
# nature (an id + result + record) and can't be wrapped without breaking
# the bash `echo` that emits them.
"tests/test_herdr_runtime.py" = ["E501"]

