    "openai-agents>=0.2.0",
]
codex-sdk = [
    # Official OpenAI Codex Python SDK — typed events + abort signal,
    # replaces our subprocess + NDJSON parsing wrapper. The wheel does
    # not bundle the codex binary; users supply it via ``npm install -g
    # @openai/codex`` (auto-discovered) or ``Codex.install(version=...)``.
    "openai-codex-sdk>=0.1.11",
]
google-adk = [
    "google-adk>=1.0.0",
]
copilot-sdk = [
    "github-copilot-sdk>=0.1.0",
]
deep-agents = [
    "deepagents>=0.5.8,<0.6.0",
    "langchain-mcp-adapters>=0.2.2,<0.3.0",
    # Required for openai/openai_compatible/openrouter/litellm provider paths
    # in agents/deep_agents.py — deepagents only pulls langchain-anthropic and
    # langchain-google-genai, so this fills the gap.
    "langchain-openai>=1.2.0,<2.0.0",
    # Native LiteLLM integration — handles provider-specific quirks
    # (DeepSeek reasoning_content, Anthropic thinking blocks, etc.) that the
    # generic ChatOpenAI masquerade silently dropped on the floor.
    # Pinned to 0.6.4 (excluding 0.6.5+) because 0.6.5 requires
    # litellm>=1.83.14 which pins openai==2.24.0 and conflicts with
    # langchain-openai>=1.2.0 (which needs openai>=2.26.0).
    "langchain-litellm>=0.6.4,<0.6.5",
    # Required for the local / bring-your-own-model (Ollama) provider path.
    # init_chat_model("ollama:<model>") in agents/deep_agents.py builds a
    # ChatOllama, which speaks Ollama's NATIVE API (data never leaves the
    # box) — the supported self-hosted local-only lane. deepagents does not
    # pull this binding, so without it the Ollama provider raises ImportError
    # at model-build time. The base `ollama` SDK dep alone is NOT enough;
    # LangChain needs this adapter package. 1.x line matches langchain-core 1.x.
    "langchain-ollama>=1.0,<2.0",
]
pydantic-ai = [
    # In-process agent backend (agents/pydantic_ai.py). ``-slim`` + the
    # ``openai`` extra deliberately: the model client is an OpenAI-compatible
    # one pointed at OUR LiteLLM proxy, so pulling the full ``pydantic-ai``
    # meta-package (every vendor SDK) would add weight we never call.
    #
    # PINNED EXACTLY, and to a version that is NOT the newest. Two reasons:
    # (1) pre-1.0-shaped release cadence — 16 releases in 3.5 months — so a
    # floating range puts breaking changes on the request path; (2) the
    # workspace's 7-day minimum-release-age supply-chain policy. 2.18.0 is the
    # newest release clearing that window as of 2026-08-01 (2.19.0 landed
    # 2026-07-28 and every version above it is newer still).
    #
    # 2.14.1 -> 2.18.0 reviewed for breaking changes across the four releases:
    # none touch our surface. 2.17.0 caches per-message OpenTelemetry
    # serialization to avoid an O(n^2) instrumentation cost, which is the
    # release that makes the Instrumentation capability affordable on a long
    # tool loop.
    #
    # The ``mcp`` extra pulls fastmcp, which moves ``starlette`` to the 1.x
    # line. That is INSIDE this project's declared range, not a violation of it:
    # the core ``fastapi>=0.134.0`` pin exists precisely because 0.134.0 dropped
    # starlette's upper bound, and fastapi 0.135.x requires only
    # ``starlette>=0.46.0``.
    "pydantic-ai-slim[openai,mcp]==2.18.0",
    # Harness capabilities (compaction, subagents, skills, planning, tool
    # output limits, step persistence). 0.11.0 is likewise the newest release
    # clearing the 7-day window as of 2026-08-01 (0.12.0 shipped 2026-07-28).
    "pydantic-ai-harness==0.11.0",
    # Agent Skills with progressive disclosure — the model sees names and
    # descriptions and pulls a skill's body only when it uses one, rather than
    # every skill riding in the system prompt each turn. The harness has no
    # skills capability of its own. Third-party (MIT); 1.2.0 is the newest
    # release clearing the 7-day minimum-release-age window (1.4.0 landed
    # 2026-07-28). Used programmatically only — see _build_skills_capability.
    "pydantic-ai-skills==1.3.0",
    # Observability. Pydantic's own OpenTelemetry platform, and the thing that
    # turns "the model feels slow" into a span with a number on it. Optional at
    # runtime: nothing is configured unless POCKETPAW_LOGFIRE_ENABLED is set, so
    # an install that never sets it pays nothing. Ranged rather than pinned
    # because it is a 4.x line on a normal cadence, unlike the pre-1.0-shaped
    # packages above.
    #
    # THE EXTRAS ARE THE INSTRUMENTORS. Each one is a thin
    # `opentelemetry-instrumentation-*` package that logfire dispatches to;
    # without it `logfire.instrument_fastapi()` raises at runtime telling you to
    # install exactly this. They are declared HERE rather than in an extra of
    # their own so there is one logfire version spec in this file: `[all]`
    # already self-references `pocketpaw[pydantic-ai]` for the same reason, and
    # the deployed image builds from `[all]`.
    #
    # Which ones and why: fastapi is a span per request with its route and
    # status; httpx is the whole outbound surface, so a slow model call and a
    # slow sandbox stop reading identically; redis is the arq queues and the run
    # stream; pymongo covers Mongo under motor and beanie; system-metrics is the
    # container's own CPU, memory and disk, which is what answers "was it the
    # code or the box". Every instrumentor is inert until something calls it, so
    # an install that never enables Logfire carries a few hundred KB of unused
    # pure Python and nothing else.
    #
    # NOT included: sqlite3 and sqlalchemy. Fabric, Instinct, the audit log and
    # the ledger all run on SQLite, and a span per statement would dominate the
    # bill for little over the operation span already wrapping them.
    "logfire[fastapi,httpx,redis,pymongo,system-metrics]>=4.39.0,<5",
]
pydantic-ai-evals = [
    # Evaluation harness, kept OUT of the runtime extra on purpose: it is a
    # development and CI dependency, and nothing in the request path imports it.
    # Version-locked to pydantic-ai-slim above — they ship from one workspace on
    # one version line, so a mismatch is a real risk rather than a theoretical
    # one.
    "pydantic-evals==2.18.0",
]
