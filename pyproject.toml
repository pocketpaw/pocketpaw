# Updated: 2026-06-10 — Add langchain-ollama to the deep-agents dependency block (and its
# mirrored bundle/dev copies) so the local / bring-your-own-model (Ollama) lane works:
# DeepAgentsBackend/LangchainReactBackend build a ChatOllama via init_chat_model("ollama:..."),
# which needs this binding. Fixes the self-hosted local-only path for the compliance ICP.
# Prior: 2026-04-29 — Release 0.4.18: dev → main sync (PR #1015) — file jail OCR/STT, scope enforcement + fail-closed require_scope, SSRF guard scaffolding, PII tightening, rate-limiter race fix + ReDoS bounds, audit-log scrubbing, dynamic cookie Secure flag, nonce-based CSP, plus bus mutation leakage and token-usage propagation fixes.
[project]
name = "pocketpaw"
version = "0.4.18"
description = "The AI agent that runs on your laptop, not a datacenter. OpenClaw alternative with one-command install."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "ai", "agent", "telegram", "assistant", "automation",
    "browser", "llm", "ollama", "openai", "anthropic",
    "self-hosted", "local-first", "privacy"
]
authors = [
    { name = "PocketPaw Team", email = "hello@pocketpaw.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Typing :: Typed",
]

dependencies = [
    # Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.1.0",
    # HTTP client (used everywhere)
    "httpx>=0.26.0",
    # Async file I/O
    "aiofiles>=23.2.0",
    # LLM Clients
    "openai>=1.60.0",
    "anthropic>=0.45.0",
    # LLM pricing — effective-dated rates compiled into the package as Python
    # source, so a lookup touches no network. It is already an unconditional
    # requirement of pydantic-ai-slim, which ee depends on hard, so it is present
    # everywhere metering runs; declared explicitly so a change in pydantic-ai's
    # own dependency list cannot silently unprice our billing.
    "genai-prices>=0.0.73",
    # Agent Backend (recommended default)
    "claude-agent-sdk>=0.1.72",
    # Dashboard (default mode — must be in core so `pip install pocketpaw` just works)
    "uvicorn[standard]>=0.31.1",
    "jinja2>=3.1.0",
    "fastapi>=0.134.0",   # fastapi 0.134.0 first allowed starlette 1.0.0 (dropped upper bound)
    "qrcode[pil]>=7.4",
    "python-multipart>=0.0.22",
    # Logging & CLI
    "rich>=13.0.0",
    "click>=8.0",
    # Scheduling
    "apscheduler>=3.10.0",
    "python-dateutil>=2.8.0",
    # Credential Encryption
    "cryptography>=46.0.0",
    # Image basics
    "pillow>=10.0.0",
    # Soul Protocol — runtime imports from soul_protocol.spec.journal and
    # soul_protocol.engine.journal for fleet installer event emission (#947).
    # Promoted from optional extra to base dep in v0.3.1 integration work;
    # the runtime now takes a hard dependency on the journal primitives.
    "soul-protocol[engine]>=0.3.1",
    # NOTE: livekit-agents / livekit-plugins-deepgram moved to ee/pyproject.toml
    # in the OSS-EE split (Phase 4) — only ee/pocketpaw_ee/cloud/livekit imports them.
    "cel-python>=0.5.0",
]

