    # Local / bring-your-own-model (Ollama) provider path — see deep-agents extra.
    "langchain-ollama>=1.0,<2.0",
    # dev tools
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",  # pinned: incompatible with pytest-asyncio 1.x until asyncio.run() call sites are migrated
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pytest-playwright>=0.7.2",
    "mongomock-motor>=0.0.36",
    "moto[s3]>=5.0.0",
    "types-aiofiles>=25.1.0.20260409",
    "import-linter>=2.11",
    "fakeredis>=2.21.0",
]

# Enterprise layer — opt-in. `uv sync --dev --group ee` installs the
# `pocketpaw-ee` package (ee/) editable on top of the OSS core, giving a full
# development environment. Plain `uv sync --dev` stays OSS-only (that is what
# the Test (OSS-only) CI job relies on).
ee = ["pocketpaw-ee"]

[tool.uv]
# Install-time supply-chain floor for this repo's own Python resolution.
#
# WHY THIS IS HERE. The workspace policy is a 7-day minimum release age: a
# version has to sit on the index for a week before we will resolve it, which
# is the one control that catches a compromised fresh publish of a package we
# already vetted (an allowlist pins WHICH package, and a ranged pin still
# floats the VERSION). That policy was documented as living in the developer's
# home directory — and those files do not exist on any machine we checked.
# `npm config get min-release-age` returns null; there is no ~/.config/uv/
# uv.toml and no UV_EXCLUDE_NEWER in the environment. So every `uv lock` /
# `uv sync` in this repo, including the CI jobs, resolved straight off PyPI
# with no age gate at all. Enforcement now lives per-repo instead: the Daytona
# build sandbox got its bun floor (#1897), paw-enterprise got its npm floor
# (#768), and this is pocketpaw's.
#
# THE UNIT IS A DATE, NOT A DURATION — this is the trade-off, and it is the
# whole reason this block needs a comment. bun's `minimumReleaseAge` is
# seconds and npm's `min-release-age` is days, so both roll forward on their
# own. uv's `exclude-newer` is an absolute timestamp: it does not move, so it
# needs a human to bump it. Keep it roughly ONE DAY behind today when you do.
# Set it too recent and there is no floor left; set it too far back and it
# starts refusing releases that have legitimately aged past the window, which
# also breaks first-party packages on a fast cadence (soul-protocol has hit
# exactly this). Bumping it is a deliberate act, not a chore to automate away.
#
# WHAT IT DOES AND DOES NOT GATE. It applies at RESOLUTION time. `uv sync`
# against the committed uv.lock still installs what the lock pins — the lock
# is the record of what was already vetted, and this stops a NEW resolve from
# reaching for something the index published yesterday. If a bump makes a
# needed dependency unresolvable, pin the previous satisfying version or raise
# it with the captain. Do not lower this date to make a resolve pass, and
# never work around it with a bypass flag.
#
# It lives in `[tool.uv]` rather than a `uv.toml` on purpose. This repo
# already keeps its uv config in pyproject.toml (`[tool.uv.sources]` below,
# and the same in ee/pyproject.toml), and adding an adjacent uv.toml makes uv
# ignore the settings fields in `[tool.uv]` entirely — verified on uv 0.10.4,
# which warns and then drops them. One config home, no split brain.
exclude-newer = "2026-08-10T00:00:00Z"

[tool.uv.sources]
pocketpaw-ee = { path = "ee", editable = true }
# RFC 08 PR 3 — Foresight CAMEL hard-dep promotion.
#
# camel-ai is required by pocketpaw-ee (the vendored OASIS fork at
# ee/pocketpaw_ee/foresight/substrate/oasis/ imports from camel.agents,
# camel.messages, camel.models, etc.). The QBTRIX fork at
# pocketpaw/v01-relax-caps removes the psutil<6 cap that collides with
# livekit-agents (an ee/ dep at psutil>=7). The source override is
# duplicated in ee/pyproject.toml (which is the one uv reads when
# resolving pocketpaw-ee's deps); keeping this entry here too means a
# root-level `uv sync` honors the same pin if anyone ever depends on
# camel-ai directly from the OSS side. See
# ee/pocketpaw_ee/foresight/substrate/oasis/README-FORK.md for full
# vendoring rationale and the psutil/openai cap audit.
camel-ai = { git = "https://github.com/qbtrix/camel-ai.git", rev = "76ff78e8c78d0a38277e421ea9aca34904b4dc37" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/cloud --ignore=tests/e2e"
markers = [
    "enforce_scope: opt a test out of the global _TESTING_FULL_ACCESS bypass so require_scope fails closed as in production",
]

# ---------------------------------------------------------------------------
# import-linter: OSS-EE boundary
# ---------------------------------------------------------------------------
# This root config holds the open-core boundary contract only. The OSS core
# package `pocketpaw` must never statically import the enterprise package
# `pocketpaw_ee`. Optional EE features are reached at runtime via entry-point
# Protocols — see pocketpaw/extensions.py + pocketpaw/_registry.py — which
# import-linter's static analysis correctly does not flag. The single
# exception is the admin CLI: `pocketpaw <cloud subcommands>` administers an
# EE install directly.
#
# The cloud Beanie-chokepoint contracts moved to ee/pyproject.toml in the
# OSS-EE split (Phase 4); run them with `cd ee && uv run lint-imports`.
#
# `pocketpaw_ee` must be importable for this contract to resolve, so
# `lint-imports` here runs only in the full (core + EE) CI job.
[tool.importlinter]
root_packages = ["pocketpaw_ee", "pocketpaw"]

[[tool.importlinter.contracts]]
name = "OSS core may not import from EE"
type = "forbidden"
source_modules = ["pocketpaw"]
forbidden_modules = ["pocketpaw_ee"]
ignore_imports = [
    "pocketpaw.tools.cli -> pocketpaw_ee.cloud",
    "pocketpaw.tools.cli -> pocketpaw_ee.cloud.shared.db",
    "pocketpaw.tools.cli -> pocketpaw_ee.cloud.pockets.service",
    "pocketpaw.tools.cli -> pocketpaw_ee.cloud.pockets.agent_context",
    "pocketpaw.tools.cli -> pocketpaw_ee.agent.pocket_specialist.cli_tool",
    # dashboard_lifecycle drains the EE InProcessExecutor on shutdown via a
    # try/except runtime import; the OSS core never imports EE statically.
    "pocketpaw.dashboard_lifecycle -> pocketpaw_ee.cloud.chat.runs.executor",
    # Same seam, same reason: request-log telemetry is batched behind a queue
    # in EE, and this is the only shutdown hook that fires under
    # FastAPI(lifespan=...), so the queued tail is flushed from here or not at
    # all. Guarded by try/except; an OSS-only install has nothing to flush.
    "pocketpaw.dashboard_lifecycle -> pocketpaw_ee.cloud._core.request_log",
    "pocketpaw.api.v1.cloud_projects -> pocketpaw_ee.cloud.daytona.client",
    "pocketpaw.api.v1.cloud_projects -> pocketpaw_ee.cloud.daytona.store",
    # atlas resolves optional EE introspection (Fabric schema) and the
    # role-aware entitlement provider via try/except ImportError seams — an
    # OSS-only install degrades to "no introspection"/default overlay and
    # never imports EE statically.
    "pocketpaw.atlas.fabric -> pocketpaw_ee.fabric",
    "pocketpaw.atlas.overlay -> pocketpaw_ee.agent.atlas_provider",
    # FL-3 agent Library verbs: the tag/move/annotate/search tools live in the
    # OSS builtin tools package (registered via _EE_TOOLS, guarded by ee/
    # availability) but act on the cloud Library. Every EE reach is a lazy
    # try/except runtime import inside a method — the module top-level imports
    # only OSS (pocketpaw.tools.protocol), and on a community install the tools
    # degrade to an "enterprise feature" message. Same pattern the tools.cli
    # dispatcher already uses for cloud pocket writes.
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud.chat.agent_service",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud.uploads.mongo_store",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud.uploads.paths",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud.uploads.folder_store",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud._core.context",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud._core.errors",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud._core.realtime.emit",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud._core.realtime.events",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud.file_versions.service",
    "pocketpaw.tools.builtin.library_verbs -> pocketpaw_ee.cloud.agents.knowledge",
    # C4-a builtin Fabric/Instinct tenancy: the shared _tenancy helper resolves
    # the caller's workspace from the cloud chat stream's identity ContextVars
    # and reads the per-run fail-closed marker (current_cloud_chat_run). Both
    # reaches are lazy try/except runtime imports INSIDE functions — the module
    # top level imports only OSS (logging), and on a community install both
    # resolve to None/False so the Fabric + Instinct tools keep their legacy
    # unscoped single-tenant behavior. Same pattern as library_verbs above.
    "pocketpaw.tools.builtin._tenancy -> pocketpaw_ee.cloud.chat.agent_service",
    # FL-5 structural edit tools (port of dewani12's #1193): the edit_document /
    # edit_slides / edit_spreadsheet tools live in the OSS builtin tools package
    # (registered via _EE_TOOLS, guarded by ee/ availability) but edit a cloud
    # Library file through the FL-2 file_versions service. Same lazy try/except
    # runtime-import pattern as the FL-3 verbs above: the module top-level imports
    # only OSS (pocketpaw.tools.protocol); a community install degrades to an
    # "enterprise feature" message.
    "pocketpaw.tools.builtin.edit_document -> pocketpaw_ee.cloud.chat.agent_service",
    "pocketpaw.tools.builtin.edit_document -> pocketpaw_ee.cloud._core.context",
    "pocketpaw.tools.builtin.edit_document -> pocketpaw_ee.cloud._core.errors",
    "pocketpaw.tools.builtin.edit_document -> pocketpaw_ee.cloud.file_versions.service",
    "pocketpaw.tools.builtin.edit_document -> pocketpaw_ee.cloud.file_versions.dto",
    "pocketpaw.tools.builtin.edit_slides -> pocketpaw_ee.cloud.chat.agent_service",
    "pocketpaw.tools.builtin.edit_slides -> pocketpaw_ee.cloud._core.context",
    "pocketpaw.tools.builtin.edit_slides -> pocketpaw_ee.cloud._core.errors",
    "pocketpaw.tools.builtin.edit_slides -> pocketpaw_ee.cloud.file_versions.service",
    "pocketpaw.tools.builtin.edit_slides -> pocketpaw_ee.cloud.file_versions.dto",
    "pocketpaw.tools.builtin.edit_spreadsheet -> pocketpaw_ee.cloud.chat.agent_service",
    "pocketpaw.tools.builtin.edit_spreadsheet -> pocketpaw_ee.cloud._core.context",
    "pocketpaw.tools.builtin.edit_spreadsheet -> pocketpaw_ee.cloud._core.errors",
    "pocketpaw.tools.builtin.edit_spreadsheet -> pocketpaw_ee.cloud.file_versions.service",
    "pocketpaw.tools.builtin.edit_spreadsheet -> pocketpaw_ee.cloud.file_versions.dto",
    # Studio — /studio Flow canvas: build_studio_flow persists the agent-drawn
    # flow project server-side through the EE cloud store when the workspace
    # has EE (cloud.studio.fal_edit pattern). Every EE reach is a lazy
    # try/except runtime import inside the method — the module top-level
    # imports only OSS (pocketpaw.tools.protocol); a community install
    # degrades to "nothing to save" and never imports EE statically.
    "pocketpaw.tools.builtin.studio_flow_tool -> pocketpaw_ee.cloud.chat.agent_service",
    "pocketpaw.tools.builtin.studio_flow_tool -> pocketpaw_ee.cloud.studio.schemas",
    "pocketpaw.tools.builtin.studio_flow_tool -> pocketpaw_ee.cloud.studio.service",
    # Proxy spend attribution: both agent backends stamp the paying workspace on
    # a LiteLLM proxy request, and the workspace comes from the same run-identity
    # ContextVar the Library verbs above read. One lazy try/except runtime import
    # inside a function, caught broadly on purpose — the module top-level imports
    # only stdlib, and a community install has no workspaces to bill, so it
    # returns None and the request goes out untagged exactly as before.
    "pocketpaw.agents.spend_attribution -> pocketpaw_ee.cloud.chat.agent_service",
]
