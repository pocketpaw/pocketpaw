# CI — runs tests and lint on every PR targeting dev.
# Created: 2026-02-26
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comparing with base branch

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check (changed files only on PRs)
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, only check files changed in this PR
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | grep '\.py$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "Checking changed Python files:"
              echo "$CHANGED_FILES"
              echo "$CHANGED_FILES" | xargs uv run ruff check
            else
              echo "No Python files changed in this PR"
            fi
          else
            # For pushes to dev/main, check entire codebase
            uv run ruff check .
          fi

      - name: Ruff format check (changed files only on PRs)
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, only check files changed in this PR
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | grep '\.py$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "Checking format of changed Python files:"
              echo "$CHANGED_FILES"
              echo "$CHANGED_FILES" | xargs uv run ruff format --check
            else
              echo "No Python files changed in this PR"
            fi
          else
            # For pushes to dev/main, check entire codebase
            uv run ruff format --check .
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set Python version
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ --ignore=tests/e2e --ignore=tests/test_frontend_syntax.py -x -q --tb=short
        env:
          POCKETPAW_LLM_PROVIDER: "ollama"
          POCKETPAW_OLLAMA_HOST: "http://localhost:11434"
