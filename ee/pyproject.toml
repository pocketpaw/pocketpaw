# PocketPaw Enterprise Edition — packaging.
#
# `pocketpaw-ee` is the enterprise layer (multi-tenant cloud, auth, rooms,
# messaging, billing, knowledge base, file storage, fleet, instinct, pocket
# specialist). It is a thin wheel that contains only `pocketpaw_ee/` and
# depends on the OSS core package `pocketpaw`.
#
# Changes:
#   - 2026-07-01 (ee-cython gate): the cython build hook is now GATED OFF by
#     default (`enable-by-default = false`) so dev / CI / editable installs stay
#     fast and readable — the ~25-min compile only fires when
#     HATCH_BUILD_HOOK_ENABLE_CYTHON=1. The static source `exclude` was removed;
#     the source-free compiled wheel is produced by the release build
#     `ee/scripts/build_compiled_wheel.sh` (compile-on + post-build strip), which
#     the enterprise Docker image installs. See
#     [tool.hatch.build.targets.wheel(.hooks.cython)] below.
#   - 2026-06-14 (ee-cython): introduced the hatch-cython compile of pocketpaw_ee
#     to native .so for per-tenant source protection. See [build-system] below;
#     the MIT core is unchanged and readable.
#   - 2026-06-12 (connector-store-unification CS-3): registered the
#     `pocketpaw.connector_state_stores` entry-point
#     (CloudConnectorStateStoreProvider) so the ConnectorRegistry's durable
#     state defaults to the WorkspaceConnector-backed cloud store.
#   - 2026-06-10 (sov/w0a-license): added the `pocketpaw-ee-license`
#     console script (operator license MINTING / keypair / verify) — see
#     `[project.scripts]` and `pocketpaw_ee/cloud/mint.py`.
#
# Versioning: `pocketpaw-ee` tracks `pocketpaw` within the same minor series.
# The `pocketpaw~=` pin below is a compatible-release constraint — it accepts
# any `pocketpaw` patch (0.4.x) without a hand-edit, but blocks a minor bump
# (0.5+) so an incompatible core can't be pulled in silently. Bump the floor
# here when EE starts depending on a feature added in a newer core patch.
[build-system]
requires = ["hatchling", "hatch-cython"]
build-backend = "hatchling.build"

[project]
name = "pocketpaw-ee"
version = "0.4.16"
description = "PocketPaw Enterprise — multi-tenant cloud, auth, rooms, billing, knowledge base, and file storage for PocketPaw."
readme = "README.md"
license = { file = "LICENSE" }  # FSL-1.1 (Apache-2.0 future license)
requires-python = ">=3.11"
keywords = ["ai", "agent", "enterprise", "multi-tenant", "cloud"]
authors = [
    { name = "PocketPaw Team", email = "hello@pocketpaw.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # OSS core — compatible-release pin within 0.4.x (see versioning note above).
    "pocketpaw~=0.4.16",
    # --- Persistence (MongoDB async ODM; beanie pulls motor + pymongo) ---
    "motor>=3.3.0",
    "beanie>=1.26.0",
    # --- Auth (user management + OAuth2 + JWT with a Beanie backend) ---
    "fastapi-users[beanie,oauth]>=13.0.0",
    "pwdlib[argon2]>=0.2.0",
    # --- MFA (TOTP) — secrets + code verification for /auth/mfa/* ---
    "pyotp>=2.9.0",
    # --- Real-time / rate limiting / cache ---
    "python-socketio>=5.11.0",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.0.0",
    # --- DNS (verified-domain TXT lookup, Wave 3 Task 12) ---
    "dnspython>=2.6.0",
    # --- Background worker (Tier 2 resumable chat runs) ---
    # arq is only imported by `pocketpaw_ee.cloud.chat.runs.arq_executor`
    # and `worker.py`; both are gated behind POCKETPAW_CLOUD_RUN_EXECUTOR=arq.
    "arq>=0.26.0",
    # --- File storage (S3 + GCS) ---
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    # --- Voice / video (LiveKit rooms + Deepgram STT) ---
    # Moved here from the core base deps in Phase 4: `livekit` is imported
    # only under ee/pocketpaw_ee/cloud/livekit/, never by the OSS core.
    "livekit-api>=0.6.0",
    "livekit-agents[codecs]>=1.5.9",
    "livekit-plugins-deepgram>=1.5.9",
    # --- Google integrations (OAuth + Workspace APIs) ---
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    # --- Composio — 200+ pre-built OAuth integrations (Gmail, Slack,
    # GitHub, Calendar, Drive, Linear, …). Each agent backend gets its
    # own Composio provider package; the wiring lives in
    # ee/pocketpaw_ee/cloud/composio/providers.py and is reached from the
    # OSS core via the ``pocketpaw.composio_tools`` entry point. The
    # pocket specialist runs on deep_agents but is deliberately kept
    # Composio-free, so Composio reaches only the parent agent.
    "composio>=0.7.0",
    "composio_claude_agent_sdk>=0.7.0",
    "composio_openai_agents>=0.7.0",
    "composio_google_adk>=0.7.0",
    "composio_langgraph>=0.7.0",
    # Foresight module (RFC 08) — promoted to hard dep in PR 3 (was the
    # pocketpaw-ee[foresight] optional extra in PR 2). CAMEL provides the
    # LLM-backend abstraction (ChatAgent, BaseModelBackend, MemoryRecord,
    # ModelFactory, FunctionTool, TextPrompt, OpenAIEmbedding) consumed
    # by the vendored OASIS fork at
    # ee/pocketpaw_ee/foresight/substrate/oasis/.
    #
    # We pin a QBTRIX fork (relax-caps branch) because CAMEL 0.2.90 caps
    # ``psutil<6`` which collides with livekit-agents (already an ee/ dep
    # at psutil>=5.9.0 with no upper bound) and the root pocketpaw
    # dependency group. The fork removes ONLY the psutil cap — the
    # openai cap was already lifted upstream so no extra patches needed.
    # See ee/pocketpaw_ee/foresight/substrate/oasis/README-FORK.md for
    # vendoring rationale; the fork-pin is verified by ``uv lock``
    # alongside langchain-openai + livekit-agents (the colliding deps).
    "camel-ai",
    # igraph is the default backend for ``oasis.AgentGraph`` (Foresight
    # uses it for the in-memory follower / approver / reports-to
    # relationship graph). The neo4j backend stays optional — we made
    # it lazy-imported in
    # ``substrate/oasis/social_agent/agent_graph.py`` so the neo4j
    # driver doesn't have to be installed. ``torch`` (needed by the
    # recsys tier we don't use) and ``sentence-transformers`` /
    # ``cairocffi`` (also recsys-only) remain unlisted; see
    # ``OASIS_RECSYS_AVAILABLE`` in
    # ``ee/pocketpaw_ee/foresight/substrate/oasis/__init__.py``.
    "igraph>=0.11",
    # --- Daytona SDK — VM/container workspaces for cloud project compute ---
    # Used by ee/pocketpaw_ee/cloud/daytona/ to provision, sync, and
    # manage sandboxes. Pinned to 0.190.x API surface.
    "daytona>=0.190.0",
    # --- Payments gateway (BC-2 — the Gateway primitive) ---
    # Dodo is the only gateway for v1, behind the IPaymentsProvider abstraction
    # in ee/pocketpaw_ee/cloud/billing/providers/ so Razorpay can drop in later.
    # PINNED to 1.105.0: the supply-chain rule on this machine enforces a 7-day
    # minimum release age. The newest dodopayments (1.105.1) was published
    # 2026-06-18 (<7 days ago) so it is BLOCKED; 1.105.0 (released 2026-06-16)
    # is the latest version that satisfies the age guard. The ``[webhooks]``
    # extra pulls ``standardwebhooks<2,>=1.0.1`` (stable since 2024) — the
    # Standard Webhooks HMAC-SHA256 verifier the inbound webhook route uses to
    # prove a payload came from Dodo before any credits are granted.
    "dodopayments[webhooks]==1.105.0",
    # --- Web Push (VAPID) — pocketpaw#1391 ---
    # py-vapid signs the VAPID JWT for Web Push; ee/pocketpaw_ee/cloud/push/
    # uses it for the per-workspace keypair + subscribe/unsubscribe endpoints.
    "py-vapid>=1.9.0",
    "pywebpush>=2.3.0",
]

[project.optional-dependencies]
# Document extraction pipeline (ee/pocketpaw_ee/cloud/extraction). The
# adapters lazy-import these, so they stay optional.
extraction = [
    "pypdf",
    "trafilatura",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    # PyMuPDF (fitz) rasterizes image-heavy PDF pages so the Gemini adapter can
    # caption scanned/diagram pages (FL-15). Pure-wheel, no system poppler.
    # Lazy-imported in gemini_flash.py, so it stays optional. Floor 1.24.0
    # (released 2024, well past the workspace 7-day supply-chain min-age rule).
    # Upper bound: MuPDF (native C) has recurring memory-corruption CVEs on
    # malformed PDFs; cap the major so a 2.x doesn't auto-adopt (review F2).
    "pymupdf>=1.24.0,<2.0",
]
# Firestore→Fabric ingest worker (ee/pocketpaw_ee/cloud/fabric_ingest). The
# reader lazy-imports google-cloud-firestore behind a Protocol, so it stays
# optional — a deployment that doesn't mirror Firestore never installs it, and
# the worker raises a clear install error if a config references Firestore
# without the extra present. Floor 2.27.0 (released 2026-04-13, well past the
# workspace's 7-day supply-chain minimum-age rule).
firestore = [
    "google-cloud-firestore>=2.27.0",
]

[project.scripts]
# Operator tool — mint / inspect enterprise license keys. Lives in EE
# because it imports `cryptography` (Ed25519) and signs with the operator's
# private key; the OSS core only ever VERIFIES. See pocketpaw_ee/cloud/mint.py.
pocketpaw-ee-license = "pocketpaw_ee.cloud.mint:main"

[project.urls]
Homepage = "https://pocketpaw.xyz"
Repository = "https://github.com/pocketpaw/pocketpaw"
Issues = "https://github.com/pocketpaw/pocketpaw/issues"

# --- Extension-point providers (OSS-EE split) ---
