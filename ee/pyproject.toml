[tool.hatch.metadata]
# Allow git+ direct references in dependencies (PEP 440 disallows them
# in published metadata by default; hatchling honors this flag locally).
# Needed for the qbtrix CAMEL fork pinned via [tool.uv.sources] below.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pocketpaw_ee"]
# Source protection for pocketpaw_ee is a TWO-part mechanism, intentionally NOT
# a static `exclude` here:
#   1. The cython build hook below is gated OFF by default (see its comment), so
#      the ordinary wheel — the one dev / CI / editable installs build — is fast
#      (~15s) and contains readable .py source. That wheel is valid and non-empty.
#   2. The source-free COMPILED wheel (only .so; no .py/.c) is produced by the
#      release build `ee/scripts/build_compiled_wheel.sh`, which compiles with the
#      hook ON and then strips the source in a post-build step (regenerating
#      RECORD via the `wheel` tool). The enterprise Docker image installs THAT.
# A static `exclude = ["**/*.py", ...]` was tried and REJECTED: with the hook OFF
# it strips source from the default wheel too (leaving an empty, broken wheel),
# and neither hatch-cython nor a build hook can conditionally drop source. Source
# removal therefore lives in the release build's strip step, never here — so the
# default readable wheel stays valid and non-empty.

[tool.hatch.build.targets.wheel.hooks.cython]
# Cython compile GATE — OFF by default. Without this, hatch-cython's build hook
# runs on every ee install (editable `uv sync --group ee`, CI test jobs,
# `pip install ./ee`), firing the ~25-min compile unconditionally (this hung CI).
# Gated off, those installs stay fast and produce readable pure-Python wheels.
# Set HATCH_BUILD_HOOK_ENABLE_CYTHON=1 to turn the compile ON and emit native
# .so artifacts — `build_compiled_wheel.sh` and the enterprise Docker stage do
# this to build the source-protected release wheel.
enable-by-default = false
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
# hatch-cython otherwise derives the source dir from the PROJECT name
# (pocketpaw-ee, hyphenated) which doesn't match the package dir pocketpaw_ee
# (underscore) → it would glob ./pocketpaw-ee/** and compile NOTHING. Pin the
# real package dir so all of pocketpaw_ee is compiled to .so.
src = "pocketpaw_ee"

[tool.hatch.build.targets.wheel.hooks.cython.options.directives]
language_level = 3
# Don't treat Python annotations as C types — FastAPI/Pydantic use annotations
# as runtime metadata. Without this, a router arg like `x: str = Depends(...)`
# makes Cython coerce the arg to str → "Expected str, got Depends" at import.
annotation_typing = false

# RFC 08 PR 3 — Foresight CAMEL hard-dep promotion. The QBTRIX fork's
# only change vs upstream camel-ai==0.2.90 is removing the psutil<6 cap
# (which collides with livekit-agents at psutil>=7). uv resolves the
# CAMEL dep via this source override when `uv lock` runs against
# ee/pyproject.toml (workspace-local source). See
# ee/pocketpaw_ee/foresight/substrate/oasis/README-FORK.md for the
# vendoring rationale and the openai/psutil cap audit.
[tool.uv.sources]
camel-ai = { git = "https://github.com/qbtrix/camel-ai.git", rev = "76ff78e8c78d0a38277e421ea9aca34904b4dc37" }

# ---------------------------------------------------------------------------
# import-linter: chokepoint contracts for ee/pocketpaw_ee/cloud/
# ---------------------------------------------------------------------------
# Rules (see ee/pocketpaw_ee/cloud CLAUDE.md):
#   1. Beanie document classes (pocketpaw_ee.cloud.models.*) may only be
#      imported from <entity>/service.py.
#   2. router.py / dto.py / domain.py within an entity must not import the
#      matching Beanie doc.
#   3. shared façades (agent_bridge, deps) orchestrate via entity services.
#
# The OSS-boundary contract ("OSS core may not import from EE") lives in the
# root pyproject.toml — it is scoped to the `pocketpaw` package.
#
# Run from the repo root (where import-linter is installed):
#   uv run lint-imports --config ee/pyproject.toml
[tool.importlinter]
root_packages = ["pocketpaw_ee"]

[[tool.importlinter.contracts]]
name = "Pockets — Beanie writes only from service.py"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "pocketpaw_ee.cloud.pockets.router",
    "pocketpaw_ee.cloud.pockets.dto",
    "pocketpaw_ee.cloud.pockets.domain",
    "pocketpaw_ee.cloud.pockets.agent_context",
    "pocketpaw_ee.cloud.pockets.source_executor",
    "pocketpaw_ee.cloud.pockets.sources_ops",
    "pocketpaw_ee.cloud.pockets._http_guard",
    "pocketpaw_ee.cloud.pockets.action_executor",
    "pocketpaw_ee.cloud.pockets.actions_ops",
    # feat/invoke-tool-v1 — the click-driven tool executor. It dispatches a
    # connector-action grant through ``connectors.service.execute`` and
    # receives the per-pocket allowlist by parameter from the router. It must
    # NEVER import a Beanie document class directly (no ``models.pocket_backend``):
    # the router/service own Beanie access.
    "pocketpaw_ee.cloud.pockets.tool_executor",
    # P2.4 Template Reconcile — the reconcile service resolves the pocket
    # (spec + slug) and writes the reconciled spec entirely through
    # `pockets.service`; it must never import the Pocket Beanie model.
    "pocketpaw_ee.cloud.pockets.reconcile",
    # RFC 04 M3 — the interval-refresh scheduler + the auto-refresh budget
    # helper. The scheduler scans pockets through `pockets.service` and
    # refreshes through `source_executor`; neither touches Beanie directly.
    "pocketpaw_ee.cloud.pockets.refresh_scheduler",
    "pocketpaw_ee.cloud.pockets._refresh_budget",
    # RFC 05 M2b.1 — the instinct bridge proposes/executes parked writes
    # through `pockets.service` and the Instinct store; it never touches
    # Beanie document classes directly.
    "pocketpaw_ee.cloud.pockets.instinct_bridge",
    # RFC 03 v2 Wave 3a — the template-level instinct dispatch wrapper.
    # Calls the pure OSS composer and the `instinct_approvals.service`
    # Beanie writer; never imports the pockets/session/backend docs.
    "pocketpaw_ee.cloud.pockets.instinct_dispatch",
    # RFC 03 v2 Wave 3b — the bulk fan-out dispatcher. Calls the pure
    # OSS ``plan_bulk_execution`` planner and the
    # ``instinct_approvals.service`` writer; orchestrates per-row
    # ``action_executor.run_action`` calls. Never imports a Beanie
    # document class directly.
    "pocketpaw_ee.cloud.pockets.bulk_dispatch",
    # RFC 03 v2 Wave 3d — the per-pocket temporal trigger dispatcher.
    # Calls the pure OSS ``sweep_temporal_triggers`` planner, the
    # ``temporal_sweeps.service`` writer, ``instinct_dispatch``, and
    # ``action_executor.run_action``. Never imports a Beanie document
    # class directly.
    "pocketpaw_ee.cloud.pockets.temporal_dispatcher",
    # M3 connector→skill auto-authoring — the connectors service re-derives a
    # pocket's surface_profile on bind/unbind and persists it through
    # ``pockets.service.apply_derived_surface_profile`` (the Beanie writer). It
    # must NOT import the Pocket Beanie model directly; the derivation module is
    # pure. Both go through ``pockets.service`` only.
    "pocketpaw_ee.cloud.connectors.service",
    "pocketpaw_ee.cloud.connectors.derivation",
    # RFC 05 Saga Compensate — the multi-step write-sequence rollback
    # runtime. Orchestrates ``action_executor.run_action`` per step and
    # fires compensations in reverse on failure; emits outcomes through
    # ``outcomes.service``. Receives backend creds + bindings by
    # parameter — never imports a Beanie document class directly.
    "pocketpaw_ee.cloud.pockets.saga",
    # Layered/learning Instinct gate foundation (2026-06-18 design). Three
    # pure helper modules for the 4-lane triage router. None writes a
    # Beanie document: ``instinct_triage`` is a pure classifier (no I/O),
    # ``trust_ledger`` reads/writes a JSONL sidecar under ~/.pocketpaw, and
    # ``instinct_compensation_registry`` is an in-memory TTL registry that
    # persists expired handles to a JSONL sidecar. The gate's Beanie writes
    # still go exclusively through ``instinct_approvals.service``.
    "pocketpaw_ee.cloud.pockets.instinct_triage",
    "pocketpaw_ee.cloud.pockets.trust_ledger",
    "pocketpaw_ee.cloud.pockets.instinct_compensation_registry",
]
forbidden_modules = [
    "pocketpaw_ee.cloud.models.pocket",
    "pocketpaw_ee.cloud.models.pocket_backend",
    "pocketpaw_ee.cloud.models.session",
]

[[tool.importlinter.contracts]]
name = "TemporalSweeps — Beanie writes only from service.py"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "pocketpaw_ee.cloud.temporal_sweeps.router",
    "pocketpaw_ee.cloud.temporal_sweeps.dto",
    "pocketpaw_ee.cloud.temporal_sweeps.domain",
    # The cron driver scans pockets through ``pockets.service`` and
    # dispatches through ``temporal_dispatcher``; it never touches a
    # Beanie document directly.
    "pocketpaw_ee.cloud._core.temporal_scheduler",
]
forbidden_modules = ["pocketpaw_ee.cloud.models.temporal_sweep_state"]

[[tool.importlinter.contracts]]
name = "InstinctApprovals — Beanie writes only from service.py"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "pocketpaw_ee.cloud.instinct_approvals.router",
    "pocketpaw_ee.cloud.instinct_approvals.dto",
    "pocketpaw_ee.cloud.instinct_approvals.domain",
]
forbidden_modules = ["pocketpaw_ee.cloud.models.instinct_approval"]

[[tool.importlinter.contracts]]
name = "Rules — Beanie writes only from service.py"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    # Discovered governed rules (SZD slice-2). Only ``rules.service`` owns the
    # InstinctRuleDoc / InstinctWorkspaceConfig Beanie writes; dto/domain/router
    # go through it. The router (feat/instinct-guardrail-rules) is thin — it maps
    # HTTP to service calls and must not import a Beanie doc directly.
    "pocketpaw_ee.cloud.rules.dto",
    "pocketpaw_ee.cloud.rules.domain",
    "pocketpaw_ee.cloud.rules.router",
]
forbidden_modules = [
    "pocketpaw_ee.cloud.models.instinct_rule",
    "pocketpaw_ee.cloud.models.instinct_workspace_config",
]

[[tool.importlinter.contracts]]
name = "AutomationsStatus — Beanie writes only from service.py"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    # feat/external-alerting-c2c3 (C3) — only ``automations_status.service`` owns
    # the WorkspaceAutomationConfig Beanie writes; dto/domain/router go through it.
    # The router is thin — it maps HTTP to service calls and must not import a
    # Beanie doc directly.
    "pocketpaw_ee.cloud.automations_status.dto",
    "pocketpaw_ee.cloud.automations_status.domain",
    "pocketpaw_ee.cloud.automations_status.router",
]
forbidden_modules = ["pocketpaw_ee.cloud.models.workspace_automation_config"]

[[tool.importlinter.contracts]]
