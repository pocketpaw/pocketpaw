connectors = "pocketpaw_ee.extensions:CloudConnectorsMcpProvider"
planner = "pocketpaw_ee.extensions:CloudPlannerMcpProvider"
pocket_planner = "pocketpaw_ee.extensions:CloudPocketPlannerMcpProvider"
