<!doctype html>
<html>
  <head><meta charset="UTF-8"></head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div style="max-width: 560px; margin: 0 auto; padding: 32px 24px;">
      <h2 style="margin-top: 0;">You've been invited! 🎉</h2>
      <p><strong>{inviter_name}</strong> has invited you to join the workspace
         <strong>{workspace_name}</strong> on PocketPaw.</p>
      <div style="margin: 28px 0;">
        <a href="{invite_url}"
           style="display: inline-block; padding: 12px 28px; background-color: #2563eb;
                  color: #fff; text-decoration: none; border-radius: 6px;
                  font-weight: 600; font-size: 15px;">
           Accept Invite →
        </a>
      </div>
      <p style="color: #6b7280; font-size: 13px;">
         This invite expires in 7 days. If you weren't expecting this,
         you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
